apis:
- aid: tuva-health:the-tuva-project
  name: The Tuva Project (dbt package)
  description: >-
    The core open-source Tuva dbt package that transforms healthcare data from the Tuva Input
    Layer into the Tuva Core Data Model and Data Marts, including data-quality tests,
    normalization, claims preprocessing, and bundled terminology sets. Distributed as a dbt
    package (dbt Hub / GitHub) that runs inside the customer's cloud data warehouse - it is
    open-source software, not a hosted HTTP or FHIR API.
  humanURL: https://thetuvaproject.com/getting-started
  tags:
  - Data Transformation
  - dbt
  - Healthcare
  properties:
  - type: Documentation
    url: https://thetuvaproject.com/getting-started
  - type: APIReference
    url: https://thetuvaproject.com/core-data-model
  - type: Package
    url: https://hub.getdbt.com/tuva-health/the_tuva_project/latest/
  - type: SourceCode
    url: https://github.com/tuva-health/tuva
- aid: tuva-health:fhir-inferno
  name: FHIR Inferno
  description: >-
    An open-source Python utility that flattens nested HL7 FHIR JSON (bundles / resources) into
    tabular CSV files so FHIR-sourced data can be loaded and mapped into the Tuva Input Layer.
    A command-line data-preprocessing tool, not a FHIR server or HTTP API - it consumes FHIR
    rather than serving it.
  humanURL: https://github.com/tuva-health/fhir_inferno
  tags:
  - FHIR
  - Data Transformation
  - Python
  properties:
  - type: Documentation
    url: https://thetuvaproject.com/guides/mapping/fhir
  - type: SourceCode
    url: https://github.com/tuva-health/fhir_inferno
- aid: tuva-health:tuva-connectors
  name: Tuva Connectors
  description: >-
    A family of open-source dbt connector projects (Medicare CCLF, BCDA, CMS synthetic, Aetna,
    BCBS, and a connector template, plus a FHIR preprocessing connector) that map raw
    claims, EHR, ADT, and FHIR source formats into the standardized Tuva Input Layer. These
    are warehouse-native dbt projects, not HTTP API endpoints.
  humanURL: https://thetuvaproject.com/connectors/overview
  tags:
  - Connectors
  - Claims
  - Interoperability
  properties:
  - type: Documentation
    url: https://thetuvaproject.com/connectors/overview
  - type: SourceCode
    url: https://github.com/tuva-health/connector_template
