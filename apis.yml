aid: tuva-health
url: https://raw.githubusercontent.com/api-evangelist/tuva-health/refs/heads/main/apis.yml
name: Tuva Health
kind: company
description: >-
  Tuva Health, Inc. is a United States healthcare data company behind The Tuva Project, an
  open-source, warehouse-native data-transformation platform that harmonizes, validates,
  normalizes, and enriches raw healthcare data - medical and pharmacy claims, EHR clinical
  data, ADT feeds, and HL7 FHIR sources - into an analytics-ready Core Data Model and a
  library of Data Marts (AHRQ measures, readmissions, quality measures, chronic conditions,
  CCSR, pharmacy). It is delivered primarily as a dbt package plus Python utilities (FHIR
  Inferno) and a family of source connectors that run inside the customer's own cloud data
  warehouse - Snowflake, Databricks, Google BigQuery, Amazon Redshift, or Microsoft Fabric -
  rather than as a hosted service. Tuva is not an HTTP or FHIR API vendor: FHIR R4 is a
  supported input format that Tuva flattens and maps into its Input Layer, not a live FHIR
  server it operates. The company pairs the open-source project with a commercial Core
  Platform. Home market is the United States.
