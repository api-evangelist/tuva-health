  There is no hosted HTTP API client library, so these ARE the first-party
  distributed artifacts. The PyPI package named "tuva" belongs to an unrelated
  vendor (tuva.ai) and is intentionally excluded; pypi.org has no fhir-inferno,
  fhir_inferno or tuva-empi package (all 404 on 2026-08-15).
