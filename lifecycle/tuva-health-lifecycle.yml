note: >-
  Tuva ships two independently versioned lines: the_tuva_project dbt package
  (cut from the tuva-core repo, published to dbt Hub) and Tuva EMPI (OCI images
  + the HTTP API in openapi/). Both are semver, both are pre-1.0, and neither is
  a Tuva-operated service - customers run them - so there is no uptime SLA and
  no status page to point at.
