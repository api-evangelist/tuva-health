  docs: https://tuva-health.github.io/tuva_empi/docs/releases
  release_notes_generation: >-
    Auto-generated from conventional-commit-style PR titles (feat/fix/docs/chore);
    maintainers curate notes, breaking changes and upgrade guides for major releases.
  release_process_docs: https://github.com/tuva-health/tuva_empi/blob/main/RELEASE.md
deprecation:
  policy_url: https://tuva-health.github.io/tuva_empi/docs/releases
  policy_published: true
  sunset_header: false
  stability: pre-1.0
  statement: >-
    Published verbatim posture: "Tuva EMPI is in very early stages of development
    and is changing rapidly. We are not yet at 1.0.0 and so breaking changes can
    occur in any release. In general, when upgrading, you should not skip versions
    as deprecated functionality may be removed soon after it's deprecated."
  note: >-
    This is a real, provider-published deprecation posture, but it is a permissive
    one - it warns that deprecated functionality is removed quickly and gives no
    minimum notice window. There is no RFC 8594 Sunset/Deprecation header support;
    the API declares no response headers at all.
